name: Public OpenAPI schema evidence compatibility

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/schemaintel/**'
      - '.github/workflows/libopenapi-realworld.yml'

permissions:
  contents: read

jobs:
  public-spec-matrix:
    name: Public spec reports libopenapi ${{ matrix.libopenapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        libopenapi: ['v0.25.0', 'v0.42.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Download pinned public specifications and verify SHA-256
        env:
          SPEC_PIN: f04b8d0bcd39c52e1cf3ad7a5fe744709832ae49
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          files = {
              "1password": ("APIs/1password.com/events/1.2.0/openapi.yaml", "567a912a79601940095aa6100f29b5cf9c9f12a10b94099b1a7952bb213914f4"),
              "ably": ("APIs/ably.io/platform/1.1.0/openapi.yaml", "87a9a24552041b3a7cd6f175be52ecd36f95e357ccef44241a41d62e3bcf1ad4"),
              "spotify": ("APIs/spotify.com/1.0.0/openapi.yaml", "4edb1dbfc6a5fec53e52d738561c56817b9a66f5c171dc236222a0bb43142b83"),
              "trello": ("APIs/trello.com/1.0/openapi.yaml", "d563070894491a9c2da6563cda530d3dd9ad11627ef477aed1dbe6d29997047e"),
              "stripe": ("APIs/stripe.com/2022-11-15/openapi.yaml", "fba83fd7ff9ce87eafa0fbbc15c382b176dac204ca21b72df1a8c361441d9ecf"),
          }
          root = pathlib.Path("realworld-specs")
          root.mkdir()
          for name,(path,want_hash) in files.items():
              url = f"https://raw.githubusercontent.com/APIs-guru/openapi-directory/{os.environ['SPEC_PIN']}/{path}"
              with urllib.request.urlopen(url, timeout=45) as resp:
                  data=resp.read((6<<20)+1)
              actual=hashlib.sha256(data).hexdigest()
              if not 0<len(data)<=6<<20 or actual!=want_hash:
                  raise RuntimeError(f"unexpected pinned public document: {name}: {len(data)} bytes SHA256 {actual}")
              (root/(name+".yaml")).write_bytes(data)
              print(f"PINNED_PUBLIC_SPEC name={name} bytes={len(data)} sha256={actual}")
          PY
      - name: Select version and adapt old BuildV3Model API in runner only
        run: |
          go mod edit -require=github.com/pb33f/libopenapi@${{ matrix.libopenapi }}
          go mod tidy
          go list -m github.com/pb33f/libopenapi
          if [ '${{ matrix.libopenapi }}' = v0.25.0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          path=Path("internal/schemaintel/load.go")
          data=path.read_text()
          patches=[
              ('\t"fmt"\n','\t"errors"\n\t"fmt"\n'),
              ('model, buildErr := doc.BuildV3Model()','model, buildErrs := doc.BuildV3Model()'),
              ('if buildErr != nil {','if len(buildErrs) > 0 {'),
              ('fmt.Errorf("build openapi model: %w", buildErr)','fmt.Errorf("build openapi model: %w", errors.Join(buildErrs...))'),
          ]
          for before,after in patches:
              if data.count(before)!=1:raise RuntimeError("unexpected parser API adapter input: "+before)
              data=data.replace(before,after)
          path.write_text(data)
          PY
          fi
      - name: Compare complete reports from local public documents
        env:
          PARAMINTEL_REALWORLD_SPEC_DIR: ../../realworld-specs
          PARAMINTEL_REALWORLD_SNAPSHOT_PATH: realworld-snapshot.json
          GOMEMLIMIT: 384MiB
        run: go test ./internal/schemaintel -run '^TestLibopenapiWatchRealWorld$' -count=1 -v -timeout=4m
      - name: Upload deterministic report snapshots
        uses: actions/upload-artifact@v4
        with:
          name: public-spec-${{ matrix.libopenapi }}
          path: internal/schemaintel/realworld-snapshot.json
          if-no-files-found: error
          retention-days: 7

  compare-public-spec-evidence:
    needs: public-spec-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: public-spec-*
          path: comparison
      - name: Require byte-identical report snapshots
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          old = pathlib.Path("comparison/public-spec-v0.25.0/realworld-snapshot.json").read_bytes()
          new = pathlib.Path("comparison/public-spec-v0.42.0/realworld-snapshot.json").read_bytes()
          print("OLD_REPORT_SHA256", hashlib.sha256(old).hexdigest())
          print("NEW_REPORT_SHA256", hashlib.sha256(new).hexdigest())
          if old != new:
              a,b = json.loads(old),json.loads(new)
              for x,y in zip(a,b):
                  if x!=y:
                      print("DIFFERING_PUBLIC_SPEC",x["name"],"old",x["parse_status"],x.get("parse_class"),"new",y["parse_status"],y.get("parse_class"))
                      for oc,nc in zip(x.get("checks",[]),y.get("checks",[])):
                          if oc!=nc:
                              print("FIRST_DIFFERING_OPERATION",oc.get("method"),oc.get("path"))
                              break
              sys.exit("Real-world evidence changed across libopenapi versions: explicit review required")
          print("REALWORLD_REPORTS_BYTE_IDENTICAL")
          PY

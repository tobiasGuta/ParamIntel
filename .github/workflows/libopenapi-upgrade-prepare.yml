name: libopenapi upgrade lockfile preparation (temporary)
on:
  push:
    branches:
      - upgrade/libopenapi-v0.42.0-20261101
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Regenerate dependencies without writing to repository
        run: |
          go mod tidy
          go list -m github.com/pb33f/libopenapi
          echo 'PARAMINTEL_BEGIN_MOD_B64'
          base64 -w0 go.mod
          echo
          echo 'PARAMINTEL_END_MOD_B64'
          echo 'PARAMINTEL_BEGIN_SUM_B64'
          base64 -w0 go.sum
          echo
          echo 'PARAMINTEL_END_SUM_B64'
          sha256sum go.mod go.sum
      - name: Smoke compilation
        run: go test ./internal/schemaintel -count=1

name: v0.9 dependency snapshot

on:
  push:
    branches:
      - feat/v0.9-schemaintel-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Generate Go 1.23 module lock state
        run: |
          go mod tidy
          echo '=== PARAMINTEL_TIDY_GO_MOD_BEGIN ==='
          cat go.mod
          echo '=== PARAMINTEL_TIDY_GO_MOD_END ==='
          echo '=== PARAMINTEL_TIDY_GO_SUM_BEGIN ==='
          cat go.sum
          echo '=== PARAMINTEL_TIDY_GO_SUM_END ==='

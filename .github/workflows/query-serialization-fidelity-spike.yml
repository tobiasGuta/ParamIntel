name: Query serialization fidelity spike

on:
  push:
    branches:
      - research/query-serialization-fidelity-20260928

permissions:
  contents: read

jobs:
  fidelity:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Record environment
        run: go version
      - name: Run wire-fidelity assertions
        id: spike
        continue-on-error: true
        shell: bash
        run: |
          set +e
          go test -tags=queryfidelityspike ./internal/mutate -run '^(TestQuerySerializationFidelitySpike|TestQueryProbeEncodingMatchesOASFormExamplePrimitive)$' -count=1 -v 2>&1 | tee "${RUNNER_TEMP}/query-fidelity.log"
          mutate_status=${PIPESTATUS[0]}
          go test -tags=queryfidelityspike ./cmd/paramintel -run '^TestOpenAPIQuerystringOperationDoesNotFallThroughToGenericQueryDiscovery$' -count=1 -v 2>&1 | tee -a "${RUNNER_TEMP}/query-fidelity.log"
          integration_status=${PIPESTATUS[0]}
          if [[ $mutate_status -ne 0 || $integration_status -ne 0 ]]; then
            exit 1
          fi
      - name: Record expected research outcome
        shell: bash
        run: |
          echo "assertion_outcome=${{ steps.spike.outcome }}"
          if [[ "${{ steps.spike.outcome }}" == "failure" ]]; then
            echo "At least one strict research assertion failed; inspect QUERY_FIDELITY_JSON and QUERYSTRING_OPERATION_JSON observations."
          else
            echo "All tested strict serialization-fidelity invariants held."
          fi
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-fidelity-go-${{ matrix.go }}
          path: ${{ runner.temp }}/query-fidelity.log
          if-no-files-found: error

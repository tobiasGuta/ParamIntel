name: v0.9 OpenAPI parser spike

on:
  push:
    branches:
      - research/v0.9-openapi-parser-spike
    paths:
      - 'research/v0.9-openapi-parser-spike/**'
      - '.github/workflows/v0.9-openapi-parser-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/v0.9-openapi-parser-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: research/v0.9-openapi-parser-spike/go.sum
      - name: Resolve isolated research dependencies
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test parser compatibility matrix
        run: go test -v ./...
      - name: Race detector
        run: go test -race ./...

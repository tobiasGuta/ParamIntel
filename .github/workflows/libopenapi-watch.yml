name: libopenapi compatibility watch (isolated)

on:
  push:
    branches:
      - test/libopenapi-compat-20261101

permissions:
  contents: read

jobs:
  schemaintel-matrix:
    name: libopenapi ${{ matrix.libopenapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PARAMINTEL_WATCH_EXAMPLE_REF_EXPECTED: ${{ matrix.libopenapi == 'v0.42.0' && 'accept' || 'reject' }}
    strategy:
      fail-fast: false
      matrix:
        libopenapi:
          - v0.25.0
          - v0.42.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Pin selected version in runner only
        run: |
          go mod edit -require=github.com/pb33f/libopenapi@${{ matrix.libopenapi }}
          go mod tidy
          go list -m github.com/pb33f/libopenapi
          git diff --stat -- go.mod go.sum
      - name: Runner-only v0.42 BuildV3Model API adapter
        if: matrix.libopenapi == 'v0.42.0'
        run: |
          sed -i '/^[[:space:]]*"errors"$/d' internal/schemaintel/load.go
          sed -i 's/if len(buildErrs) > 0 {/if buildErrs != nil {/' internal/schemaintel/load.go
          sed -i 's/errors.Join(buildErrs\.\.\.)/buildErrs/' internal/schemaintel/load.go
          git diff -- internal/schemaintel/load.go
      - name: Focused compatibility, evidence and resource-bound tests
        id: focused
        continue-on-error: true
        env:
          PARAMINTEL_WATCH_RESOURCE: '1'
          PARAMINTEL_WATCH_SNAPSHOT_PATH: evidence.jsonl
        run: go test -mod=mod ./internal/schemaintel -run '^TestLibopenapiWatch' -count=1 -v -timeout=3m
      - name: Upload evidence snapshot from each version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libopenapi-evidence-${{ matrix.libopenapi }}
          path: internal/schemaintel/evidence.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Existing schema intelligence regression suite
        id: schema
        continue-on-error: true
        run: go test -mod=mod ./internal/schemaintel -count=1 -timeout=3m
      - name: Full ParamIntel regression suite
        id: full
        continue-on-error: true
        run: go test -mod=mod ./... -count=1 -timeout=4m
      - name: Fail on any test failure
        if: always()
        run: |
          echo 'focused=${{ steps.focused.outcome }} schema=${{ steps.schema.outcome }} full=${{ steps.full.outcome }}'
          test '${{ steps.focused.outcome }}' = success
          test '${{ steps.schema.outcome }}' = success
          test '${{ steps.full.outcome }}' = success

  compare-evidence:
    name: Cross-version evidence snapshot comparison
    needs: schemaintel-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libopenapi-evidence-*
          path: evidence
      - name: Compare candidate, skip and provenance snapshots byte-for-byte
        run: |
          echo 'Comparing complete schema-intelligence reports'
          diff -u evidence/libopenapi-evidence-v0.25.0/evidence.jsonl evidence/libopenapi-evidence-v0.42.0/evidence.jsonl
          echo 'WATCH_CROSS_VERSION_EVIDENCE_IDENTICAL'
